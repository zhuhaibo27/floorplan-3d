<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>110-B 户型平面图</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background-color: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
  }

  .floorplan-container {
    background: #ffffff;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    max-width: 900px;
    width: 100%;
  }

  h1 {
    text-align: center;
    font-size: 24px;
    color: #333;
    margin-bottom: 10px;
  }

  p.subtitle {
    text-align: center;
    color: #888;
    font-size: 14px;
    margin-bottom: 40px;
  }

  /* 核心网格系统：根据图1精确尺寸还原 */
  .floorplan {
    display: grid;
    /* 从左到右各列宽度 (米) */
    grid-template-columns: 2.29m 2.56m 3.47m;
    /* 从上到下各行高度 (米) */
    grid-template-rows: 2.89m 2.60m 2.49m 4.06m 0.73m;
    gap: 0.12m; /* 模拟墙体厚度 */
    background-color: #333; /* 墙体颜色 */
    border: 0.12m solid #333;
    border-radius: 6px;
    margin: 0 auto;
    width: 100%;
    /* 限制最大宽度，防止在大屏上过大 */
    max-width: 800px; 
  }

  /* 房间通用样式 */
  .room {
    background: #fdfdfd;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 8px;
    position: relative;
    transition: background 0.3s ease;
  }

  .room:hover {
    background: #f0f8ff;
    cursor: pointer;
  }

  /* 房间名称和尺寸 */
  .room .name {
    font-weight: bold;
    font-size: 16px;
    color: #222;
  }

  .room .size {
    font-size: 12px;
    color: #888;
    margin-top: 4px;
  }

  /* 图标容器 */
  .icon {
    position: absolute;
    top: 10px;
    right: 10px;
    opacity: 0.6;
  }

  .icon svg {
    width: 28px;
    height: 28px;
    fill: #555;
  }

  /* --- 根据图纸 1 和 2 精确定位每个房间 --- */
  
  /* 1. 上部布局 */
  .bedroom-top {
    grid-column: 1 / 2;
    grid-row: 1 / 3; /* 高度 2.89 + 2.60 */
  }
  .kitchen {
    grid-column: 2 / 3;
    grid-row: 1 / 2; /* 高度 2.89 */
  }
  .bathroom-top {
    grid-column: 3 / 4;
    grid-row: 1 / 2; /* 高度 2.89 */
  }
  .entrance {
    grid-column: 1 / 2;
    grid-row: 3 / 4; /* 高度 2.49 */
  }
  .dining {
    grid-column: 2 / 4;
    grid-row: 2 / 4; /* 高度 2.60 + 2.49 */
  }

  /* 2. 中部核心区域 (客厅) */
  .living-room {
    grid-column: 1 / 3;
    grid-row: 4 / 5; /* 高度 4.06 */
  }
  .bathroom-bottom {
    grid-column: 3 / 4;
    grid-row: 4 / 5; /* 高度 4.06 */
  }

  /* 3. 下部卧室区 */
  .master-bedroom {
    grid-column: 1 / 2;
    grid-row: 5 / 6; /* 高度 0.73 */
  }
  .bedroom-bottom {
    grid-column: 2 / 3;
    grid-row: 5 / 6; /* 高度 0.73 */
  }
  
  /* 4. 底部阳台 */
  .balcony {
    grid-column: 1 / 4;
    grid-row: 6 / 7;
    border-top: 2px dashed #999;
    background: #f7f7f7;
  }
  .balcony .name {
    color: #555;
    font-weight: normal;
    font-size: 15px;
  }

  /* 响应式调整：在小屏幕上缩放 */
  @media (max-width: 768px) {
    .floorplan-container { padding: 20px; }
    .floorplan { gap: 2px; border-width: 2px; border-radius: 4px; }
    .room .name { font-size: 14px; }
    .room .size { font-size: 10px; }
    .icon svg { width: 20px; height: 20px; }
  }
</style>
</head>
<body>

<div class="floorplan-container">
  <h1>110-B 户型平面图</h1>
  <p class="subtitle">基于原始 CAD 精确尺寸绘制 (单位: 米)</p>
  
  <div class="floorplan">
    
    <!-- 1. 上部区域 -->
    <div class="room bedroom-top">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M20 9.37V4a1 1 0 00-1-1H5a1 1 0 00-1 1v5.37A3 3 0 003 12v5a2 2 0 002 2h2a2 2 0 002-2v-3h6v3a2 2 0 002 2h2a2 2 0 002-2v-5a3 3 0 00-1-2.63z"/></svg>
      </div>
      <div class="name">次卧</div>
      <div class="size">2.29m × 5.49m</div>
    </div>

    <div class="room kitchen">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M20 3H4a2 2 0 00-2 2v14a2 2 0 002 2h16a2 2 0 002-2V5a2 2 0 00-2-2zM4 5h16v2H4V5zm0 14v-8h16v8H4z"/></svg>
      </div>
      <div class="name">厨房</div>
      <div class="size">2.56m × 2.89m</div>
    </div>

    <div class="room bathroom-top">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M7 7a3 3 0 100 6 3 3 0 000-6zm10 2a2 2 0 11-4 0 2 2 0 014 0zm-9 9h8v2H8v-2z"/></svg>
      </div>
      <div class="name">公卫</div>
      <div class="size">3.47m × 2.89m</div>
    </div>

    <div class="room entrance">
      <div class="name">玄关</div>
      <div class="size">2.29m × 2.49m</div>
    </div>

    <div class="room dining">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M4 9a2 2 0 012-2h12a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V9z M2 13h20v4H2v-4z"/></svg>
      </div>
      <div class="name">餐厅</div>
      <div class="size">6.15m × 5.09m</div>
    </div>

    <!-- 2. 中部区域 -->
    <div class="room living-room">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M20 16v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2H2v-3h20v3h-2zM6 8a4 4 0 014-4h4a4 4 0 014 4v5H6V8z"/></svg>
      </div>
      <div class="name">客厅</div>
      <div class="size">4.85m × 4.06m</div>
    </div>

    <div class="room bathroom-bottom">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M7 7a3 3 0 100 6 3 3 0 000-6zm10 2a2 2 0 11-4 0 2 2 0 014 0zm-9 9h8v2H8v-2z"/></svg>
      </div>
      <div class="name">主卫</div>
      <div class="size">3.47m × 4.06m</div>
    </div>

    <!-- 3. 下部区域 -->
    <div class="room master-bedroom">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M20 9.37V4a1 1 0 00-1-1H5a1 1 0 00-1 1v5.37A3 3 0 003 12v5a2 2 0 002 2h2a2 2 0 002-2v-3h6v3a2 2 0 002 2h2a2 2 0 002-2v-5a3 3 0 00-1-2.63z"/></svg>
      </div>
      <div class="name">主卧</div>
      <div class="size">2.29m × 0.73m</div>
    </div>

    <div class="room bedroom-bottom">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M20 9.37V4a1 1 0 00-1-1H5a1 1 0 00-1 1v5.37A3 3 0 003 12v5a2 2 0 002 2h2a2 2 0 002-2v-3h6v3a2 2 0 002 2h2a2 2 0 002-2v-5a3 3 0 00-1-2.63z"/></svg>
      </div>
      <div class="name">次卧</div>
      <div class="size">2.56m × 0.73m</div>
    </div>

    <!-- 4. 底部阳台 -->
    <div class="room balcony">
      <div class="name">观景阳台</div>
    </div>

  </div>
</div>

</body>
</html>
